[project]
name = "stat-inference-final-project"
version = "0.1.0"
description = "Statistical Inference Final Project: 2016 UK EU Referendum Analysis"
readme = "README.md"
authors = [
    { name = "datacon10", email = "conor.kelly@bse.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "itables>=2.9.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.scripts]
stat-inference-final-project = "stat_inference_final_project:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
